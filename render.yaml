services:
  - type: web
    name: marbefa-poultry-api
    runtime: python
    region: oregon  # change to your preferred region
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    rootDir: backend
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,mpanalytics.online,www.mpanalytics.online"
      - key: DJANGO_CORS_ORIGINS
        value: "https://mpanalytics.online,https://www.mpanalytics.online"
      - key: DJANGO_SECRET_KEY
        generateValue: true
